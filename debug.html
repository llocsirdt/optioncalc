<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Debug — one variant, one day</title>
<script src="shared/market-calendar.js"></script>
<script src="shared/run-completeness.js"></script>
<script src="shared/portfolio-risk.js"></script>
<script src="client/lib/risk-curve-cell.js"></script>
<script src="client/lib/strategy-positions.js"></script>
<link rel="stylesheet" href="client/nq-chart.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="client/lib/nq-chart.js"></script>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#888; --grid:#e6e6e6; --profit:#26a69a; --loss:#ef5350; --zero:#bbb;
    --locked:#8b5cf6; --warn:#c98b8b; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; }
  header { padding:8px 14px 6px; border-bottom:1px solid var(--grid); }
  h1 { font-size:16px; margin:0 0 6px; display:inline-block; }
  h1 .ver { color:var(--muted); font:400 11px ui-monospace,monospace; margin-left:6px; }
  .ctl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  select, input[type=date], button { font:12px system-ui,sans-serif; padding:3px 6px; border:1px solid #ccc;
    border-radius:4px; background:#fff; color:inherit; }
  button { cursor:pointer; }
  .meta { color:var(--muted); font:11px ui-monospace,monospace; margin-left:2px; }
  .wrap { padding:10px 14px 40px; }
  /* The stat strip is its OWN .wrap so it can span both columns, which meant it inherited the generic
     40px bottom tail and then the next .wrap added its own 10px top — ~50px of dead space between the
     numbers and the charts they describe. Tighten both sides here and let the columns start right under. */
  .wrap-stats { padding-bottom:0; }
  .wrap-stats + .wrap { padding-top:8px; }
  .wrap-stats .side-by-side { margin-top:0; }
  .two { display:flex; gap:14px; align-items:flex-start; }
  .col-left { flex:1 1 0; min-width:0; }
  .col-right { flex:1 1 0; min-width:0; }
  .side-by-side { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  /* The stat row spans both columns; its panels share the width and wrap rather than squeezing. */
  /* NOT equal thirds. The two kv panels are label/value pairs that right-align their numbers, so extra
     width just stretches the gap between name and figure — they looked spread out while "Live vs backtest"
     (a 4-column table: metric / backtest / live / delta) was squeezed. Size each to what it actually
     holds: the kv panels take what they need, the comparison table gets the remainder. */
  #statRow > .panel { flex:0 1 auto; min-width:0; }
  #statRow > .panel:nth-child(1),
  #statRow > .panel:nth-child(2) { flex:1 1 260px; max-width:340px; }
  #statRow > #cmpPanel { flex:2 1 420px; max-width:none; }
  .side-by-side .panel { flex:1 1 0; min-width:0; }
  /* DENSE stat panels: they frame the trades table rather than compete with it, so they trade padding and
     leading for height. Long labels ellipsize instead of wrapping to a second line. */
  .side-by-side.dense .panel { padding:5px 7px; }
  .side-by-side.dense .panel h2 { font-size:11px; margin:0 0 3px; }
  .side-by-side.dense .kv { font-size:10.5px; line-height:1.25; }
  .side-by-side.dense .kv div { padding:0; gap:8px; }
  .side-by-side.dense .kv .k { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Below ~1100px two columns stop helping — the table gets too narrow to read next to a chart. */
  @media (max-width: 1100px) { .two { flex-direction:column; } .col-right .panel { max-height:none !important; } }
  #nq-chart { height:300px; }
  #nq-chart-container { border:0; }
  .panel { border:1px solid var(--grid); border-radius:6px; padding:8px 10px; }
  .panel h2 { font-size:12px; margin:0 0 6px; font-weight:700; }
  /* The shared cell renderer emits a FIXED-WIDTH svg (it is sized for a grid cell). Dropped into a flex
     column narrower than that it spilled over the panel and covered the day-summary next to it. Constrain
     the box and let the svg scale inside its own viewBox instead. */
  .panel { overflow:hidden; min-width:0; }
  /* RESERVE THE CHART BOX. The SVG is CW x CH with width:100%/height:auto, so its rendered height is
     always width * CH/CW. Holding that same aspect-ratio on the container means the space is identical
     whether or not a curve is in it — scrubbing the timeline back before the first trade no longer
     collapses the panel and shoves the NQ chart and everything below it up the page. The ratio is set
     from the CW/CH constants at boot so there is one source of truth; this is just the pre-JS fallback. */
  #curveBox { position:relative; width:100%; aspect-ratio: 900 / 300; }
  #curveBox svg { display:block; width:100%; height:auto; max-width:100%; }
  /* Empty state fills the reserved box rather than leaving it blank, so the panel reads as "nothing to
     show yet" instead of looking broken. */
  #curveBox .curveEmpty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font:12px ui-monospace,monospace; color:var(--muted); border:1px dashed var(--line); border-radius:4px; }
  /* HEADER. The title stays left; the numeric groups (actual / if-filled / backtest) stack right-aligned,
     one per row. They used to run on as a single "·"-joined sentence that wrapped mid-group at narrow
     widths, so a line could begin with a stray value belonging to the previous group. */
  .curveHead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  /* Reserve THREE rows. The meta stacks actual / if-filled / backtest, and when the book is empty it
     drops to a single "no positions" line — which pulled the NQ chart and everything under it up ~35px
     every time the timeline was scrubbed back before the first trade. Holding the height keeps the page
     still; the rows are nowrap and line-height 1.5, so 3 x 1.5em is exactly what a full header occupies. */
  .curveHead .meta { text-align:right; font-weight:400; min-height:4.5em; display:block; }
  .curveHead .meta .mrow { display:block; white-space:nowrap; line-height:1.5; }
  /* The "now" readout, positioned along the curve exactly as the compare cell does it. */
  .nowlbl { position:absolute; bottom:2px; transform:translateX(-50%); white-space:nowrap;
    font:11px ui-monospace,monospace; color:#555; background:rgba(255,255,255,.86); padding:0 3px; border-radius:3px; }
  .nowlbl i { font-style:normal; font-weight:700; margin-left:5px; }
  /* Time-of-day playback, same control the compare grid uses. */
  #timebar { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #timebar input[type=range] { flex:1; }
  .tb-time { font:11px ui-monospace,monospace; color:var(--muted); min-width:150px; text-align:right; }
  .kv { font:11px ui-monospace,monospace; }
  .kv div { display:flex; justify-content:space-between; gap:14px; padding:1px 0; }
  .kv .k { color:var(--muted); }
  table.ord { border-collapse:collapse; font:11px ui-monospace,monospace; width:100%; }
  table.ord th { text-align:right; padding:3px 6px; border-bottom:1px solid var(--grid); color:var(--muted);
    font-weight:600; white-space:nowrap; position:sticky; top:0; background:#fff; cursor:help;
    text-decoration:underline dotted rgba(125,125,125,.6); text-underline-offset:3px; }
  table.ord th:first-child, table.ord td:first-child { text-align:left; }
  table.ord td { text-align:right; padding:2px 6px; border-bottom:1px solid #f2f2f2; white-space:nowrap; }
  tr.td-unfilled { background:#fff6f6; opacity:.85; }
  tr.td-unfilled td:first-child { border-left:2px solid var(--loss); }
  tr.td-uncovered td:first-child { border-left:2px solid #e0a03c; }
  tr.td-cover td { color:#555; }
  tr.td-hedge td { color:#6b5ea8; background:#faf9ff; }
  tr.td-hedge td:first-child { border-left:2px solid #8b5cf6; }
  td.legs { font-size:10.5px; color:#444; text-align:left; }
  .net { font:600 9px system-ui,sans-serif; padding:0 3px; border-radius:2px; }
  .net.cr { background:#e6f5f2; color:#1c7f72; } .net.dr { background:#f1f1f1; color:#666; }
  .p { color:var(--profit); } .l { color:var(--loss); } .m { color:var(--muted); }
  /* Same encoding the risk curve uses: a floor above zero is LOCKED (violet), not merely a smaller loss. */
  .lk { color:var(--locked); } .z { color:var(--zero); }
  /* The values carry the colour; the labels around them stay muted so the numbers lead. */
  .curveHead .meta .mrow { color:var(--muted); }
  .curveHead .meta .mrow .p, .curveHead .meta .mrow .l,
  .curveHead .meta .mrow .lk, .curveHead .meta .mrow .z { font-weight:600; }
  .tag { padding:0 5px; border-radius:3px; font:600 9.5px system-ui,sans-serif; }
  .tag.ok { background:#e6f5f2; color:#1c7f72; } .tag.no { background:#fdecea; color:#a5322c; }
  .tag.w  { background:#f3efff; color:#5b3fa8; }
  /* LIVE vs BACKTEST strip. Four columns (metric / backtest / live / Δ) rather than two stacked panels:
     the whole point is reading ACROSS one row, and a gap you have to compute in your head is a gap you
     do not notice. --bt is the backtest's identity colour and is used for the curve, this table's header
     and the backtest order rows, so the three always refer to the same thing. */
  :root { --bt:#c9781f; }
  table.cmp { border-collapse:collapse; font:11px ui-monospace,monospace; width:100%; }
  table.cmp th { text-align:right; padding:2px 6px; border-bottom:1px solid var(--grid); color:var(--muted); font-weight:600; }
  table.cmp th.bt { color:var(--bt); }
  table.cmp td { text-align:right; padding:2px 6px; border-bottom:1px solid #f6f6f6; }
  table.cmp td:first-child, table.cmp th:first-child { text-align:left; color:var(--muted); }
  /* The fill rate IS the gap — it gets the emphasis so the eye lands there first. */
  table.cmp tr.hero td { font-weight:700; background:#fffaf2; }
  tr.td-bt td { background:#fffaf3; }
  tr.td-bt td:first-child { border-left:2px solid var(--bt); }
  td.srcTag { font:700 9.5px system-ui,sans-serif; }
  .note { color:var(--muted); font-size:11px; margin:4px 0 0; max-width:900px; line-height:1.45; }
  #err { color:var(--loss); font:12px ui-monospace,monospace; padding:8px 14px; }
  /* It is empty on every normal load, and an empty box still occupied its padding — a permanent 16px
     gutter reserved for an error that is almost never there. */
  #err:empty { display:none; }
</style>

<header>
  <h1>Strategy Debug <span class="ver">v3.8.83</span></h1>
  <div class="ctl">
    <label>variant <select id="variant"></select></label>
    <label>date <input type="date" id="date"></label>
    <label>source
      <select id="src"><option value="live">Live runs (prod)</option><option value="backtest">Backtest replay (local)</option></select>
    </label>
    <button id="reload">Reload</button>
    <span class="meta" id="meta"></span>
  </div>
</header>
<div id="err"></div>
<div class="wrap wrap-stats">
  <!-- THE NUMBERS THAT FRAME BOTH COLUMNS. These three are read against the chart AND the table, so they
       sit above both rather than inside the right column where they were competing with the orders list
       for its vertical space. Kept dense — they are a reference while reading, not the main event. -->
  <div class="side-by-side dense" id="statRow">
    <div class="panel">
      <h2>Day summary</h2>
      <div class="kv" id="summary"></div>
    </div>
    <div class="panel">
      <h2>Backtest expectation <span class="meta">(765d)</span></h2>
      <div class="kv" id="baseline"></div>
    </div>
    <!-- THE EXECUTION GAP. Same day, same candles, same signal — so every number that differs here is
         execution or pricing, never market luck. Hidden until a backtest for this variant+date loads. -->
    <div class="panel" id="cmpPanel" style="display:none">
      <h2>Live vs backtest <span class="meta" id="cmpMeta"></span></h2>
      <table class="cmp" id="cmp"></table>
    </div>
  </div>
</div>
<div class="wrap">
  <!-- TWO COLUMNS. Left: the risk curve with the NQ candles directly beneath it, so the price action and
       the curve share one eye-line — the point is to see WHICH candle pattern was forming when a trade went
       on, and what that trade did to the curve. Right: the trades, scrolling independently so the table can
       be read against a chart that stays put. -->
  <div class="two">
    <div class="col-left">
      <div class="panel">
        <h2 class="curveHead">Risk curve at settle <span class="meta" id="curveMeta"></span></h2>
        <div id="curveBox"><div id="curve"></div></div>
        <div id="timebar"><span style="font-size:11px;color:var(--muted)">Time of day</span>
          <input type="range" id="timeSlider" min="0" max="1" value="1" step="1" disabled>
          <span id="timeLabel" class="tb-time">full day</span></div>
      </div>

      <!-- The same NQ chart the index page uses. Trade markers are pushed in via NQChart.setTrades, so the
           opens and covers in the table appear on the candles at the times they were placed. -->
      <div class="panel" style="margin-top:10px">
        <h2>NQ futures <span class="meta">— trade markers from this run</span></h2>
        <div id="nq-chart-container">
          <div id="nq-chart-toolbar">
            <span id="nq-chart-tf-buttons"></span>
            <span id="nq-chart-ohlc" class="nq-chart-ohlc"></span>
          </div>
          <div id="nq-chart"></div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="panel" style="display:flex; flex-direction:column; max-height:calc(100vh - 300px)">
        <h2>Orders <span class="meta" id="ordMeta"></span>
          <span id="ordSrcWrap" style="float:right; font-weight:400; display:none">
            <select id="ordSrc" style="font-size:10.5px; padding:1px 4px">
              <option value="live">live only</option><option value="bt">backtest only</option>
              <option value="both">both, interleaved</option>
            </select></span></h2>
        <div id="ordScroll" style="flex:1; overflow:auto; min-height:0">
          <table class="ord" id="orders"></table>
        </div>
        <p class="note" id="ordNote"></p>
      </div>
    </div>
  </div>
</div>

<script>
// STRATEGY DEBUG — one variant, one day, in enough detail to answer "was that order placed where we
// expected?" without reading a JSON file.
//
// It exists because the aggregate views cannot show the thing that actually decides a day: for every
// cover, what the market was at the moment we placed it, what limit we sent, and what the rule would
// have allowed. On 2026-09-08 that comparison is the whole story — 43 of 101 covers never filled, and
// every one of them was resting below a market that had already moved past the profit ceiling.
//
// Split routing matches compare.html: LIVE runs come from PROD (the local engine only records while this
// machine is awake, so its days end at whatever ragged time the Mac slept). The BACKTEST used to be pinned
// to LOCAL because "the deployed box has no 5m datasets" — true when written, obsolete since the engine
// moved under server/ and gained on-demand day building from Schwab. Prod now answers for any recent date,
// so pinning to LOCAL just meant "backtest overlay only works while your Mac is running the dev server",
// which is what produced "local backtest server not running" when viewing the deployed page.
const IS_LOCAL_ORIGIN = (location.protocol === 'file:')
  || /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
const _p = new URLSearchParams(location.search);
const LOCAL_BASE = 'http://localhost:3001', PROD_BASE = 'https://d1kbxyxn33vpw2.cloudfront.net';
const forced = _p.get('proxy');
const LIVE_BASE = forced === 'local' ? LOCAL_BASE : forced === 'remote' ? PROD_BASE : PROD_BASE;
// Same resolution compare.html uses: LOCAL only when actually served locally, PROD otherwise.
const BT_BASE   = forced === 'local' ? LOCAL_BASE : forced === 'remote' ? PROD_BASE
                : (IS_LOCAL_ORIGIN ? LOCAL_BASE : PROD_BASE);
// nq-chart.js reads its API base off this global. Candles always come from LIVE_BASE: the chartseries
// endpoint is a PROD service, independent of whether the run record itself is live or a local backtest.
const PROXY_URL = LIVE_BASE;

const $ = (id) => document.getElementById(id);
const usd = (n) => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const sgn = (n) => n == null ? 'm' : n > 0 ? 'p' : n < 0 ? 'l' : 'm';
const num = (n, d = 2) => n == null ? '—' : (+n).toFixed(d);
const showErr = (m) => { $('err').textContent = m || ''; };

let record = null, baselines = null;
// The SAME day re-run by the backtest engine, in the same record shape (see the /candle-spread/backtest
// endpoint). Null whenever there is no 5m dataset for the date, the local server is down, or we are
// already looking at a backtest — every one of those is normal and the live side must render regardless.
let btRecord = null, btNote = '';

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status} — ${url.split('?')[0]}`);
  return r.json();
}

// ---- load -------------------------------------------------------------------------------------
async function loadVariants() {
  try {
    const j = await getJson(`${LIVE_BASE}/api/v1/candle-spread/runs?cb=${Date.now()}`);
    const list = (j.variants || []).map((v) => (typeof v === 'string' ? v : v.variant)).filter(Boolean);
    const sel = $('variant');
    sel.innerHTML = list.map((v) => `<option${v === (_p.get('variant') || 'v7-10') ? ' selected' : ''}>${v}</option>`).join('');
  } catch (e) { showErr('could not list variants: ' + e.message); }
}

async function loadBaselines() {
  for (const base of [BT_BASE, LIVE_BASE]) {
    try {
      const j = await getJson(`${base}/api/v1/candle-spread/baselines?cb=${Date.now()}`);
      baselines = j.variants || j; return;
    } catch (e) { /* try the other side */ }
  }
}

// The BACKTEST twin of the run on screen: the same variant, the same date, run from the 5m candles by
// the backtest engine and returned in the LIVE record shape. It is an OVERLAY, never a mode — the live
// run stays the subject of the page and this answers "what should the candles have produced?".
// Local-only by nature (the 5m datasets are gitignored), so a failure here is expected, not an error:
// it records a note and leaves btRecord null.
async function loadBacktest(variant, date) {
  btRecord = null; btNote = '';
  // Overlaying a backtest on a backtest compares nothing.
  if ($('src').value === 'backtest') { btNote = 'viewing the backtest replay'; return; }
  try {
    btRecord = await getJson(`${BT_BASE}/api/v1/candle-spread/backtest?symbol=NDX&date=${date}&variant=${encodeURIComponent(variant)}&cb=${Date.now()}`);
  } catch (e) {
    // Name the host that actually failed. "local backtest server not running" was simply wrong whenever
    // BT_BASE pointed at prod, and it sent you looking at the wrong machine.
    const where = BT_BASE === LOCAL_BASE ? 'local backtest server not running' : 'backtest host unreachable';
    btNote = /404/.test(e.message) ? 'no data for this date (not pre-built, and not buildable on demand)'
      : /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? where
      : e.message;
  }
}

async function load() {
  showErr('');
  const variant = $('variant').value, date = $('date').value;
  if (!variant || !date) return;
  const base = $('src').value === 'backtest' ? BT_BASE : LIVE_BASE;
  $('meta').textContent = 'loading…';
  try {
    record = await getJson(`${base}/api/v1/candle-spread/runs/NDX/${date}?date=${date}&variant=${variant}&cb=${Date.now()}`);
  } catch (e) {
    record = null; showErr(`no run for ${variant} on ${date} (${e.message})`);
    $('meta').textContent = ''; $('orders').innerHTML = ''; $('summary').innerHTML = '';
    // curveMeta too: it carries the previous day's min/max and its backtest line, which reads as though
    // the failed day had those numbers.
    $('curve').innerHTML = ''; $('curveMeta').textContent = ''; $('ordMeta').textContent = '';
    $('cmpPanel').style.display = 'none'; $('ordSrcWrap').style.display = 'none'; return;
  }
  // Render the live side FIRST and let the backtest arrive after: the engine run is fast but the dataset
  // parse on a cold server is not, and the page must never sit blank waiting on an optional overlay.
  render();
  await loadBacktest(variant, date);
  if (record) render();
}

// ---- render -----------------------------------------------------------------------------------
function settleEvent() {
  return (record.events || []).filter((e) => e.type === 'eod_settlement').pop() || null;
}

function render() {
  const st = record.state || {}, cfg = record.config || {};
  const se = settleEvent();
  const W = cfg.spreadWidth, ML = (cfg.continuousCoverMinLockFrac || 0) * W;
  const pos = st.positions || [];
  const assess = window.RunCompleteness ? window.RunCompleteness.assessRun(record) : null;

  $('meta').innerHTML = `${cfg.variant || ''} · W $${W} · minLock $${num(ML)} · capFrac ${cfg.capFrac != null ? cfg.capFrac : '—'}`
    + (assess ? ` · <b>${assess.label}</b>` : '');

  // ---- summary
  const covered = pos.filter((p) => p.covered).length;
  const unfilled = pos.filter((p) => p.pendingCover && !p.covered).length;
  const fillPct = (covered + unfilled) ? Math.round(covered / (covered + unfilled) * 100) : null;
  const rows = [
    ['opens', pos.length],
    ['covers filled', covered],
    ['covers UNFILLED', unfilled],
    ['cover fill rate', fillPct == null ? '—' : fillPct + '%'],
    ['floor (covered only)', usd(se && se.floorPnl)],
    ['TERMINAL', usd(se && se.terminalPnl)],
    ['naked drag', se && se.terminalPnl != null && se.floorPnl != null ? usd(se.terminalPnl - se.floorPnl) : '—'],
    ['settle', se && se.settle != null ? num(se.settle, 2) + (se.settleSource ? ` (${se.settleSource})` : '') : '—'],
  ];
  $('summary').innerHTML = rows.map(([k, v]) =>
    `<div><span class="k">${k}</span><span class="${k === 'TERMINAL' || k === 'naked drag' ? sgn(parseFloat(String(v).replace(/[^0-9.-]/g, ''))) : ''}">${v}</span></div>`).join('');

  // ---- backtest expectation for THIS variant, so live and expected sit side by side
  const b = baselines && baselines[cfg.variant];
  $('baseline').innerHTML = b ? [
    ['avg/day', usd(b.avgDaily)], ['win%', b.winRate != null ? Math.round(b.winRate * 100) + '%' : '—'],
    ['avgWin', usd(b.avgWin)], ['avgLoss', usd(b.avgLoss)],
    ['trades/day', b.avgTradesPerDay != null ? (+b.avgTradesPerDay).toFixed(1) : '—'],
    ['avgLossPot', usd(b.avgWorstCase)], ['riskMax', b.governor ? usd(-b.governor.lossMax) : 'none'],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span>${v}</span></div>`).join('')
    : '<div class="k">no baseline for this variant</div>';

  buildTimeIndex();
  setupSlider();
  renderCmp();
  renderOrders();
  renderCurve(pos, se, null);
  syncNQ();
}

// ---- live vs backtest -------------------------------------------------------------------------
// Pull the five numbers that decide a day out of a run record, the SAME way for both sides. The fill
// rate in particular is per POSITION (covered vs covered+still-resting) on both sides — the engine's own
// coverBySrc counter uses a different denominator (every placement, including re-placements), so mixing
// the two would invent a gap that is not there.
function statsOf(rec) {
  if (!rec) return null;
  const pos = ((rec.state || {}).positions) || [];
  const se = (rec.events || []).filter((e) => e.type === 'eod_settlement').pop() || null;
  const covered = pos.filter((p) => p.covered).length;
  const unfilled = pos.filter((p) => p.pendingCover && !p.covered).length;
  const isHedge = (p) => p.hedge || /^off-|^wing-/.test(p.id || '');
  return {
    terminal: se && se.terminalPnl != null ? se.terminalPnl : null,
    floor: se && se.floorPnl != null ? se.floorPnl : null,
    opens: pos.filter((p) => !isHedge(p)).length,
    placed: covered + unfilled, covered, unfilled,
    fill: (covered + unfilled) ? Math.round(covered / (covered + unfilled) * 100) : null,
    settle: se && se.settle != null ? se.settle : null,
  };
}
function renderCmp() {
  const panel = $('cmpPanel');
  const B = statsOf(btRecord), L = statsOf(record);
  $('ordSrcWrap').style.display = B ? '' : 'none';
  // No backtest for this date (the usual case) — the strip disappears entirely and renderCurve's header
  // says why in one phrase. A missing overlay must never look like a broken page.
  if (!B || !L) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  // Δ is LIVE − BACKTEST throughout, so a negative number always means "live did worse than the candles
  // said it should" — one direction to learn, on every row.
  const d = (l, b, fmt, goodHigh = true) => {
    if (l == null || b == null) return '<td class="m">—</td>';
    const g = l - b, cls = g === 0 ? 'm' : (g > 0) === goodHigh ? 'p' : 'l';
    return `<td class="${cls}">${g > 0 ? '+' : ''}${fmt(g)}</td>`;
  };
  const pct = (n) => (n == null ? '—' : n + '%');
  const rows = [
    ['terminal P&L', usd(B.terminal), usd(L.terminal), d(L.terminal, B.terminal, usd), ''],
    ['floor (covered only)', usd(B.floor), usd(L.floor), d(L.floor, B.floor, usd), ''],
    ['opens', B.opens, L.opens, d(L.opens, B.opens, (n) => String(n), true), ''],
    ['covers placed', B.placed, L.placed, d(L.placed, B.placed, (n) => String(n), true), ''],
    ['cover FILL RATE', pct(B.fill), pct(L.fill), d(L.fill, B.fill, (n) => n + 'pt'), 'hero'],
  ];
  $('cmp').innerHTML = '<thead><tr><th>metric</th><th class="bt">backtest</th><th>live</th><th>Δ live−bt</th></tr></thead><tbody>'
    + rows.map(([k, b, l, dd, cls]) => `<tr class="${cls}"><td>${k}</td><td>${b}</td><td>${l}</td>${dd}</tr>`).join('')
    + '</tbody>';
  // A settle that differs between the two sides means they are not actually comparing the same day —
  // worth saying out loud rather than quietly producing a plausible-looking gap.
  const dsettle = (B.settle != null && L.settle != null) ? Math.abs(B.settle - L.settle) : null;
  $('cmpMeta').innerHTML = `same day, same candles — the gap is execution + pricing`
    + (btRecord.model ? ` · <span style="color:var(--bt)">${btRecord.model}</span>` : '')
    + (dsettle != null && dsettle > 1 ? ` · <b class="l">settle differs by ${num(dsettle, 1)}</b>` : '');
}

// Park the NQ chart on THIS run's session and mark its opens/covers on the candles — the same marker
// shape the index page pushes (open triangle by side, cover diamond), so a trade in the table can be
// found on the tape. Markers come from the same converter the order table uses, so the two agree.
function syncNQ() {
  if (!(window.NQChart && window.NQChart.setTrades)) return;
  const conv = window.strategyRunToOptionArray
    ? window.strategyRunToOptionArray(record, { includeUnfilled: true }) : null;
  const trades = [];
  for (const p of (conv && conv.positions) || []) {
    if (p.openEpoch) trades.push({ epoch: p.openEpoch, side: p.side, type: 'open' });
    if (p.covered && p.coverEpoch) trades.push({ epoch: p.coverEpoch, side: p.side, type: 'cover' });
  }
  window.NQChart.setTrades(trades);          // markers first, so the date jump can pan to them
  const date = $('date').value;
  if (date) window.NQChart.jumpToDate(date, { focusTrades: true });
}

// THE ORDER TABLE. Built on the SAME data shape the index page's "Strategy Trades" panel uses
// (strategyRunToOptionArray -> positions), so the columns, the row semantics and the glyphs match:
// ▲/▼ opens coloured by side, ◇ covers, OPEN* for an open with no FILLED cover, a dimmed
// "COVER**" row for every resting order that was sent and never filled, and CR/DB net tags. The
// double star mirrors OPEN*'s single star (uncovered): one star = this leg still lacks its pair,
// two = the order to make the pair was placed and never filled. Shorter than "(unfilled)" too.
// Reusing the producer rather than reimplementing it is the point — a lookalike would drift.
//
// The diagnostic columns are APPENDED, not substituted: the cover's mark when it was placed, the
// ceiling the rule allowed, the gap between the two, and whether a profitable cover was available at
// all. That comparison is what makes "was this order placed where we expected?" answerable by looking.
//
// TWO SOURCES, ONE TABLE (interleaved by time, with a src column) rather than two tables or a swap.
// The question this view answers is "the backtest covered here — where was live?", and that is a
// question about ORDER and TIMING: side-by-side tables force you to match timestamps by eye across a
// gap, and a toggle shows one sequence while you try to remember the other. Interleaved, a backtest
// cover that booked at 11:05 sits directly above the live cover that was still resting at 11:10, and
// the Cost column puts the two prices on adjacent lines. The selector still offers each side alone,
// because once you know WHERE the divergence is you want to read one sequence without the other.
function orderEvents(rec, src) {
  const conv = window.strategyRunToOptionArray
    ? window.strategyRunToOptionArray(rec, { includeUnfilled: true }) : null;
  const P = (conv && conv.positions) || [];
  const cfg = rec.config || {};
  const W = cfg.spreadWidth, ML = (cfg.continuousCoverMinLockFrac || 0) * W;
  const se = (rec.events || []).filter((e) => e.type === 'eod_settlement').pop() || null;
  const byId = {}; for (const p of (se && se.positions) || []) byId[p.id] = p;
  const raw = {}; for (const p of ((rec.state || {}).positions) || []) raw[p.id] = p;

  // Same numbering rule as the index: #1.. by open time, covers inherit their open's number. Numbering is
  // PER SOURCE, so live #7 and backtest #7 are each side's seventh open — pairing them by index would be a
  // fiction the moment the two engines open a different number of positions.
  const evs = [];
  P.forEach((p) => {
    evs.push({ id: p.id, type: 'open', side: p.side, time: p.openTime, epoch: p.openEpoch || 0,
      legs: p.openLegs || '', cost: Math.round((p.openLimit || 0) * 100 * (p.quantity || 1)), net: p.openNet || 'DEBIT' });
    if (p.coverLegs) evs.push({ id: p.id, type: 'cover', side: p.side, time: p.coverTime, epoch: p.coverEpoch || 0,
      legs: p.coverLegs, cost: Math.round((p.coverLimit || 0) * 100 * (p.quantity || 1)), net: p.coverNet || 'DEBIT' });
    else if (p.unfilledCover) evs.push({ id: p.id, type: 'cover', unfilled: true, side: p.side,
      time: p.unfilledCover.time, epoch: p.unfilledCover.epoch || (p.openEpoch || 0) + 1,
      legs: p.unfilledCover.legs, cost: Math.round((p.unfilledCover.limit || 0) * 100 * (p.quantity || 1)),
      net: p.unfilledCover.net || 'DEBIT' });
  });
  const seq = new Map();
  evs.filter((e) => e.type === 'open').sort((a, b) => a.epoch - b.epoch).forEach((e, i) => seq.set(e.id, i + 1));
  const coveredIds = new Set(evs.filter((e) => e.type === 'cover' && !e.unfilled).map((e) => e.id));
  for (const e of evs) {
    e.src = src; e.W = W; e.ML = ML; e.raw = raw[e.id] || {}; e.sp = byId[e.id] || null;
    e.seq = seq.get(e.id); e.isCovered = coveredIds.has(e.id);
    // Hedge kind: live encodes it in the id prefix (off-/wing-), the backtest record carries explicit
    // hedge/wing flags (its ids are bt-N). Read BOTH so a backtest offset is not mislabelled "OPEN*",
    // i.e. an exposed position waiting on a cover it will never get.
    e.hedgeKind = (e.raw.wing || /^wing-/.test(e.id)) ? 'WING' : (e.raw.hedge || /^off-/.test(e.id)) ? 'OFFSET' : null;
  }
  return evs;
}

function renderOrders() {
  const mode = btRecord ? $('ordSrc').value : 'live';
  const showBt = btRecord && mode !== 'live', showLive = mode !== 'bt';
  let evs = [];
  if (showLive) evs = evs.concat(orderEvents(record, 'live'));
  if (showBt) evs = evs.concat(orderEvents(btRecord, 'bt'));
  // Time first, then opens before covers at the same stamp, then live before backtest — so a shared
  // 5m mark reads live-then-backtest consistently instead of shuffling per bar.
  evs.sort((a, b) => a.epoch - b.epoch || (a.type === 'open' ? -1 : 1) - (b.type === 'open' ? -1 : 1)
    || (a.src === 'live' ? -1 : 1) - (b.src === 'live' ? -1 : 1));
  const both = showBt && showLive;

  const COLS = (both ? [['src', 'which engine placed this order — LIVE (real broker) or BT (backtest engine, same candles)']] : []).concat([
    ['Time', 'ET time of the order'],
    ['Pos', 'position number, chronological by open; a cover carries its open’s number'],
    ['Event', '▲/▼ open (coloured by side), ◇ cover. OPEN* = no FILLED cover, so still exposed'],
    ['Legs', 'the spread as actually sent'],
    ['Cost', 'cash for the order; CR = credit received, DB = debit paid'],
    ['open %W', 'open cost as a fraction of width — capFrac caps this, and the closer to it, the less room a cover has'],
    ['mark', 'the cover’s MARK when the resting order was placed'],
    ['ceiling', 'W − openCost − minLock: the most the rule allows. This is what gets sent'],
    ['gap', 'sent − mark. Negative means it rests BELOW the market and only fills if the market comes to it'],
    ['cover?', 'was a profitable cover even available at placement (mark ≤ ceiling)?'],
    ['P&L', 'this position’s P&L at settlement'],
  ]);
  const usdc = (c) => (c < 0 ? '-$' : '$') + Math.abs(c).toLocaleString();
  const color = (sd) => (sd === 'bull' ? 'var(--profit)' : 'var(--loss)');
  const glyph = (e) => e.hedgeKind ? '⬡'
    : e.type === 'open' ? (e.side === 'bull' ? '▲' : '▼') : '◇';

  let restingBelow = 0, everCoverable = 0;
  const body = evs.map((e) => {
    const open = e.type === 'open';
    // Hedges (floorOffset `off-*`, wing conversion `wing-*`) reshape the risk curve; they are not strategy
    // opens and are never covered, so "OPEN*" misrepresented them as exposed positions awaiting a cover.
    const hedge = e.hedgeKind;
    const isUncov = open && !hedge && !e.isCovered;
    const label = hedge ? hedge
      : open ? (isUncov ? 'OPEN*' : 'OPEN') : (e.unfilled ? 'COVER**' : 'COVER');
    const cr = e.net === 'CREDIT';
    const r = e.raw, pc = r.pendingCover || {}, W = e.W, ML = e.ML;
    const ceiling = (W != null && r.limit != null) ? +(W - r.limit - ML).toFixed(2) : null;
    const mark = pc.markAtPlace != null ? pc.markAtPlace : null;
    const sent = pc.target != null ? pc.target : null;
    const gap = (sent != null && mark != null) ? +(sent - mark).toFixed(2) : null;
    const coverable = (mark != null && ceiling != null) ? mark <= ceiling : null;
    if (!open && e.src === 'live') { if (gap != null && gap < 0) restingBelow++; if (coverable) everCoverable++; }
    const sp = e.sp;
    // Diagnostics belong to the COVER order, so they only render on cover rows.
    const diag = open
      ? `<td class="${r.limit / W > 0.55 ? 'l' : 'm'}">${r.limit != null && W ? Math.round(r.limit / W * 100) + '%' : '—'}</td>`
        + '<td class="m">—</td><td class="m">—</td><td class="m">—</td><td class="m">—</td>'
      : '<td class="m">—</td>'
        + `<td>${num(mark)}</td><td class="m">${num(ceiling)}</td>`
        + `<td class="${gap != null && gap < 0 ? 'l' : 'm'}">${gap == null ? '—' : (gap > 0 ? '+' : '') + num(gap)}</td>`
        + `<td>${coverable == null ? '—' : coverable ? '<span class="tag ok">yes</span>' : '<span class="tag no">no</span>'}</td>`;
    // The backtest tint sits UNDER the live semantics: a backtest row still shows unfilled-red / hedge-purple
    // where those apply, so the two sides are read with the same vocabulary and only the ground colour and
    // the src tag say which engine placed the order.
    return `<tr class="td-${e.type}${e.src === 'bt' ? ' td-bt' : ''}${isUncov ? ' td-uncovered' : ''}${e.unfilled ? ' td-unfilled' : ''}${hedge ? ' td-hedge' : ''}" title="${e.src}:${e.id}">`
      + (both ? `<td class="srcTag" style="color:${e.src === 'bt' ? 'var(--bt)' : '#555'}">${e.src === 'bt' ? 'BT' : 'LIVE'}</td>` : '')
      + `<td>${e.time || '—'}</td><td>#${e.seq || '?'}</td>`
      // Hedge rows take the row's purple here too (the inline colour otherwise beats tr.td-hedge).
      + `<td style="color:${hedge ? '#6b5ea8' : color(e.side)}">${glyph(e)} ${label}</td>`
      + `<td class="legs">${e.legs}</td>`
      + `<td>${cr ? '+' : ''}${usdc(e.cost)} <span class="net ${cr ? 'cr' : 'dr'}">${cr ? 'CR' : 'DB'}</span></td>`
      + diag
      + `<td class="${open && sp ? sgn(sp.pnl) : ''}">${open && sp ? usd(sp.pnl) : '—'}</td></tr>`;
  }).join('');

  $('orders').innerHTML = '<thead><tr>' + COLS.map(([c, t]) => `<th title="${t.replace(/"/g, '&quot;')}">${c}</th>`).join('')
    + '</tr></thead><tbody>' + body + '</tbody>';
  const tally = (s) => {
    const E = evs.filter((e) => e.src === s);
    const opens = E.filter((e) => e.type === 'open' && !e.hedgeKind).length;
    const hedges = E.filter((e) => e.type === 'open' && e.hedgeKind).length;
    const covers = E.filter((e) => e.type === 'cover').length;
    const unf = E.filter((e) => e.type === 'cover' && e.unfilled).length;
    return E.length ? `${opens} opens · ${covers} covers${unf ? ` (${unf} unfilled)` : ''}`
      + (hedges ? ` · ${hedges} hedge${hedges === 1 ? '' : 's'}` : '') : '';
  };
  $('ordMeta').innerHTML = (showLive ? tally('live') : '')
    + (both ? ' &nbsp;·&nbsp; <span style="color:var(--bt)">BT ' + tally('bt') + '</span>'
      : showBt ? '<span style="color:var(--bt)">' + tally('bt') + '</span>' : '');
  // The mark/gap diagnostics only exist on the LIVE side — the backtest engine does not record a cover's
  // mark at placement — so this footer stays about the live execution even when both are on screen.
  $('ordNote').innerHTML = `<b>${restingBelow}</b> LIVE cover(s) rested BELOW the market; <b>${everCoverable}</b> `
    + `had a profitable cover available at placement. When "cover?" is <span class="tag no">no</span>, the mark `
    + `had already moved past the ceiling — the rule demands a locked profit, so no fillable price exists and `
    + `the position rides to expiry uncovered. That is the difference between a small loss and the full one.`
    + (showBt ? ` <span style="color:var(--bt)">Backtest rows carry no mark/gap: the engine prices from the model `
      + `and never records what the market was showing, so those columns are blank by construction, not missing.</span>` : '');
}

// THE COMPARE PAGE'S CELL, rendered at full size. Identical code path, so the colouring, the dashed
// backtest references, the locked-floor violet and the extremes on the right edge all behave the same —
// a lookalike reimplementation would drift the moment either page changed.
const CW = 900, CH = 300;
const fmtN = (n) => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const usdK = (n) => n == null ? '—' : (Math.abs(n) >= 1000
  ? (n < 0 ? '-$' : '+$') + (Math.abs(n) / 1000).toFixed(1) + 'k'
  : (n < 0 ? '-$' : '+$') + Math.abs(Math.round(n)));
function pnlAtPrice(curve, x) {
  if (!curve || !curve.length) return null;
  let best = curve[0];
  for (const p of curve) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
  return best.y;
}
let dbgAbs = 0;   // one chart, so the saturation reference is that chart's own magnitude
// fontScale 2.1: this page draws ONE chart at full width, where the compare grid's thumbnail-sized
// 8-9.5px labels are unreadable. The peak, the floor and the dashed backtest averages are the numbers
// this page exists to show, so they get to be legible.
const cellCurve = window.RiskCurveCell.make({ fmtN, usdK, pnlAtPrice, CW, CH, gAbs: () => dbgAbs, fontScale: 2.1, padPx: { top: 26, bottom: 38 } });

// Build the same {curve, lo, hi, underlying, underPnl, ...} shape the compare grid feeds its cell.
// `dom` PINS the x-domain to another cell's. Overlay curves must be sampled over the SAME price range as
// the curve they sit on, or the two polylines are drawn in different coordinate systems and the picture
// silently lies (the backtest's settle can differ from live's by a fraction, which is enough).
// THE ACTUAL ORDER, NOT THE DEBIT-CANONICAL ONE. A position's `coverLegs`/`coverLimit` are the
// debit-canonical booking — the economics for the position's own style — but when capitalRecapture sends
// a cover as a CREDIT, the REAL order has different legs and the cash flows the other way. The engine's
// computeTerminalPnl handles this by preferring the actual order from the log; this page did not, and
// always used the debit-canonical fallback with a POSITIVE cost. On v7-10 for 2026-09-10 that produced
// -$2,083 against the record's -$4,943, a $2,860 error, because 5 of 21 covers were sent as CREDIT.
// capitalRecapture is on for all 80 variants, so this affected every strategy on every day.
function coverOrdersByPosition(rec) {
  const m = new Map();
  for (const e of (rec && rec.events) || []) {
    if ((e.type === 'order_simulated' || e.type === 'order_sent') && e.meta && e.meta.of && e.meta.legs
        && /cover/.test(e.meta.kind || '')) m.set(e.meta.of, e.meta);
  }
  return m;
}

function buildCell(pos, se, dom, rec) {
  const orders = coverOrdersByPosition(rec || record);
  const legs = [];
  let cost = 0;
  for (const p of pos) {
    const qty = p.quantity || 1;
    // The OPEN can be a credit too (capitalRecapture alternates debit/credit opens to reclaim cash), in
    // which case the real order is pos.sentLegs at pos.sentLimit and the cash flows IN, not out.
    const oCredit = p.sentNet === 'CREDIT' && p.sentLegs && p.sentLegs.length;
    const oLegs = oCredit ? p.sentLegs : (p.legs || []);
    const oCost = oCredit ? -(p.sentLimit || 0) : (p.limit || 0);
    for (const l of oLegs) legs.push({ ...l, quantity: qty, cost: p.limit });
    cost += oCost * 100 * qty;
    if (p.covered) {
      const ord = orders.get(p.id);
      const cl = (ord && ord.legs) ? ord.legs : (p.coverLegs || []);
      const climit = (ord && ord.limit != null) ? ord.limit : (p.coverLimit || 0);
      const isCredit = ord ? ord.net === 'CREDIT' : (p.coverSentNet === 'CREDIT');
      for (const l of cl) legs.push({ ...l, quantity: qty, cost: climit });
      cost += (isCredit ? -climit : climit) * 100 * qty;   // a credit cover RECLAIMS cash
    }
  }
  if (!legs.length) return null;
  const under = se && se.settle != null ? se.settle : null;
  const centre = under || 29500;
  const lo = dom ? dom.xMin : centre * 0.985, hi = dom ? dom.xMax : centre * 1.015;
  const curve = [];
  for (let i = 0; i <= 240; i++) {
    const x = lo + (hi - lo) * (i / 240);
    let v = 0;
    for (const l of legs) {
      const intr = l.type === 'C' ? Math.max(0, x - l.strike) : Math.max(0, l.strike - x);
      v += (l.side === 'long' ? 1 : -1) * intr * 100 * (l.quantity || 1);
    }
    curve.push({ x, y: v - cost });
  }
  const ys = curve.map((c) => c.y);
  return { curve, lo: Math.min(...ys), hi: Math.max(...ys), xMin: lo, xMax: hi,
    worst: Math.min(...ys), best: Math.max(...ys),
    underlying: under, underPnl: under != null ? pnlAtPrice(curve, under) : null };
}

// TIME PLAYBACK. strategyRunToOptionArray takes an asOfEpoch and returns the book as it stood at that
// moment, so scrubbing rebuilds the curve rather than merely moving a marker — the same mechanism the
// compare grid uses. dayMin/dayMax come from the positions' own stamps (now including hedges, which
// derive theirs from the id when the record predates stamping).
let dayMin = 0, dayMax = 0, underMap = [];
function buildTimeIndex() {
  dayMin = 0; dayMax = 0; underMap = [];
  const st = (record && record.state) || {};
  const eps = [];
  for (const p of st.positions || []) {
    const e = p.openEpoch || (/^[a-z]+-(\d{13})-/.exec(p.id || '') || [])[1];
    if (e) eps.push(+e);
    if (p.coverEpoch) eps.push(p.coverEpoch);
  }
  for (const e of record.events || []) {
    if (e.type === 'candle_close' && e.underlying != null) {
      const t = Date.parse(e.time);
      if (Number.isFinite(t)) { underMap.push({ epoch: t, under: e.underlying }); eps.push(t); }
    }
  }
  const se = settleEvent();
  if (se && se.settle != null) {
    const t = Date.parse(se.time);
    if (Number.isFinite(t)) { underMap.push({ epoch: t, under: se.settle }); eps.push(t); }
  }
  underMap.sort((a, b) => a.epoch - b.epoch);
  if (eps.length) { dayMin = Math.min(...eps); dayMax = Math.max(...eps); }
}
function underlyingAt(T) {
  if (!underMap.length) return null;
  let u = underMap[0].under;
  for (const p of underMap) { if (p.epoch <= T) u = p.under; else break; }
  return u;
}
function currentT() {
  const s = document.getElementById('timeSlider');
  if (!s || s.disabled || !dayMax) return null;
  const t = Number(s.value);
  return Number.isFinite(t) && t < dayMax ? t : null;
}
function setupSlider() {
  const s = document.getElementById('timeSlider'), lbl = document.getElementById('timeLabel');
  if (!s) return;
  if (!dayMax || dayMax <= dayMin) { s.disabled = true; lbl.textContent = 'full day (no intraday stamps)'; return; }
  s.disabled = false; s.min = String(dayMin); s.max = String(dayMax);
  s.step = String(Math.max(1, Math.round((dayMax - dayMin) / 400)));
  s.value = String(dayMax);
  lbl.textContent = 'full day';
}
function sliderLabel(T) {
  const lbl = document.getElementById('timeLabel');
  if (!lbl) return;
  if (T == null) { lbl.textContent = 'full day'; return; }
  lbl.textContent = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit',
    minute: '2-digit', hour12: false }).format(new Date(T)) + ' ET';
}

// THE COUNTERFACTUAL BOOK: every resting cover that never filled, treated as filled at the price it was
// resting at. Drawn as the dashed blue line against the solid actual curve, so the gap between them IS
// the execution shortfall — the two lines converge as the fill problem gets fixed. Positions the engine
// never even placed a cover on are left alone; this measures unfilled ORDERS, not missing decisions.
function filledBook(pos) {
  let any = false;
  const out = pos.map((p) => {
    const pc = p.pendingCover;
    if (p.covered || !pc || !pc.legs) return p;
    any = true;
    return { ...p, covered: true, coverLegs: pc.legs, coverLimit: pc.target };
  });
  return any ? out : null;
}

let curveCell = null, curveCellFilled = null, curveCellBt = null;   // kept for the click readout

// The book as it stood at T, for ANY record (live or backtest) — the backtest record carries the same
// openEpoch/coverEpoch stamps, so the slider rewinds both curves together rather than freezing one.
function bookAsOf(rec, T) {
  const pos = ((rec && rec.state && rec.state.positions) || []);
  if (T == null || !window.strategyRunToOptionArray) return pos;
  const conv = window.strategyRunToOptionArray(rec, { asOfEpoch: T });
  const keep = new Set((conv.positions || []).map((x) => x.id));
  return pos.filter((p) => keep.has(p.id)).map((p) => {
    const c = (conv.positions || []).find((x) => x.id === p.id);
    return c && !c.covered ? { ...p, covered: false, coverLegs: null, coverLimit: null } : p;
  });
}

function renderCurve(pos, se, T) {
  const host = document.getElementById('curve');
  // Rebuild the book as of T; at full day this is the whole book, so the default path is unchanged.
  const bookPos = T != null ? bookAsOf(record, T) : pos;
  const d = buildCell(bookPos, T != null ? null : se);
  if (d && T != null) {
    const u = underlyingAt(T);
    d.underlying = u;
    d.underPnl = u != null ? pnlAtPrice(d.curve, u) : null;
  }
  if (!d) {
    host.outerHTML = '<div id="curve"><div class="curveEmpty">no positions at this time</div></div>';
    $('curveMeta').textContent = 'no positions';
    return;
  }
  dbgAbs = Math.max(Math.abs(d.lo), Math.abs(d.hi));
  const bt = (baselines && record && baselines[(record.config || {}).variant]) || null;
  const btRef = bt ? { worst: bt.avgWorstCase, best: bt.avgBestCase } : null;
  // The "now" readout — underlying and the P&L AT that underlying — positioned along the curve, exactly
  // as the compare cell does it. Without it the vertical line says where we are but not what it is worth.
  let nowlbl = '';
  if (d.underlying != null) {
    const xu = ((d.underlying - d.xMin) / ((d.xMax - d.xMin) || 1)) * 100;
    const lx = Math.max(4, Math.min(96, xu));
    const pnl = d.underPnl != null
      ? `<i style="color:${d.underPnl >= 0 ? 'var(--profit)' : 'var(--loss)'}">${fmtN(d.underPnl)}</i>` : '';
    nowlbl = `<div class="nowlbl" style="left:${lx.toFixed(1)}%">${Math.round(d.underlying)}${pnl}</div>`;
  }
  // THREE CURVES, one y-scale:
  //   solid black       what the book ACTUALLY is
  //   dashed blue       the same book if every resting cover had filled  (the execution ceiling)
  //   dashed amber      the same day as the BACKTEST engine ran it       (what the candles alone imply)
  // The blue line isolates fills; the amber line includes everything — different opens, different cover
  // prices, model marks instead of a crossed spread — so blue sitting well short of amber says the gap is
  // more than fills, and blue reaching amber says fills were the whole of it.
  const fb = filledBook(bookPos);
  let dF = fb ? buildCell(fb, T != null ? null : se, d) : null;
  if (dF) { dF.label = 'if all covers filled'; }
  // The backtest twin is sampled on the LIVE curve's x-domain (see buildCell's `dom`) so the polylines
  // share a coordinate system.
  const btSe = btRecord ? ((btRecord.events || []).filter((e) => e.type === 'eod_settlement').pop() || null) : null;
  let dB = btRecord ? buildCell(bookAsOf(btRecord, T), T != null ? null : btSe, d) : null;
  if (dB) { dB.label = 'backtest, same day'; dB.color = '#c9781f'; dB.labelColor = '#a35f13'; dB.dash = '8 3'; }
  curveCell = d; curveCellFilled = dF; curveCellBt = dB;
  // All curves must share one y-scale or the comparison is meaningless.
  const all = [d, dF, dB].filter(Boolean);
  const yLo = Math.min(...all.map((c) => c.lo)), yHi = Math.max(...all.map((c) => c.hi));
  dbgAbs = Math.max(Math.abs(yLo), Math.abs(yHi));
  host.outerHTML = `<div id="curve">${cellCurve((record.config || {}).variant, d, yLo, yHi, btRef, [dF, dB])}${nowlbl}</div>`;
  const gap = (dF && d.underPnl != null && dF.underPnl != null) ? dF.underPnl - d.underPnl : null;
  const bgap = (dB && d.underPnl != null && dB.underPnl != null) ? dB.underPnl - d.underPnl : null;
  // One ROW per source so the groups can never wrap into each other: actual, if-filled, backtest.
  // COLOUR THE MONEY, matching the chart directly above rather than inventing a second scheme: the curve
  // paints a floor ABOVE zero violet (--locked: no settlement price loses money, a different STATE from a
  // small loss) and below zero red, with the peak in green. The header said the same three numbers in
  // uniform grey, so the one cell that most wants to be read at a glance was the least legible.
  // The if-filled and backtest rows keep their SOURCE colours (blue / brown) — there the colour is
  // identity, not sign, and overriding it would lose which curve a number belongs to.
  const money = (n, positiveIsLocked) => {
    if (n == null || !Number.isFinite(n)) return fmtN(n);
    const cls = n > 0 ? (positiveIsLocked ? 'lk' : 'p') : n < 0 ? 'l' : 'z';
    return `<span class="${cls}">${fmtN(n)}</span>`;
  };
  const rowActual = `min ${money(d.lo, true)} · max ${money(d.hi)}`
    + (d.underlying != null ? ` · settle ${Math.round(d.underlying)} → ${money(d.underPnl)}` : '');
  const rowFilled = dF
    ? `<span style="color:#3d86c6">if filled ${fmtN(dF.lo)} / ${fmtN(dF.hi)}`
      + (gap != null ? ` (${gap >= 0 ? '+' : ''}${fmtN(gap)} at settle)` : '') + '</span>'
    : '';
  const rowBt = dB
    ? `<span style="color:var(--bt)">backtest ${fmtN(dB.lo)} / ${fmtN(dB.hi)}`
      + (bgap != null ? ` (${bgap >= 0 ? '+' : ''}${fmtN(bgap)} at settle)` : '') + '</span>'
    : btNote ? `<span class="m">backtest: ${btNote}</span>` : '';
  $('curveMeta').innerHTML = [rowActual, rowFilled, rowBt].filter(Boolean)
    .map((r) => `<span class="mrow">${r}</span>`).join('')
    + `<span class="mrow"><span id="curvePick"></span></span>`;
}

// ---- boot -------------------------------------------------------------------------------------
(async function boot() {
  // Keep the reserved chart box exactly the shape the SVG renders at, from the same constants.
  const cb = document.getElementById('curveBox');
  if (cb) cb.style.aspectRatio = `${CW} / ${CH}`;
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('date').value = _p.get('date') || today;
  if (_p.get('src')) $('src').value = _p.get('src');
  await loadVariants();
  await loadBaselines();
  await load();
  for (const id of ['variant', 'date', 'src']) $(id).addEventListener('change', load);
  // Click anywhere on the curve to read the P&L at that settlement price — same interaction as the
  // compare grid. Reports BOTH the actual book and the if-all-filled book so the execution gap is
  // readable at any price, not only at the settle.
  document.getElementById('curveBox').addEventListener('click', (e) => {
    const svg = e.target.closest('svg[data-v]'); if (!svg || !curveCell) return;
    const rect = svg.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / (rect.width || 1)));
    const price = curveCell.xMin + frac * (curveCell.xMax - curveCell.xMin);
    const pnl = pnlAtPrice(curveCell.curve, price);
    const cur = svg.querySelector('line.cursor');
    if (cur) { const cx = (frac * CW).toFixed(1); cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.setAttribute('visibility', 'visible'); }
    const pick = document.getElementById('curvePick');
    if (pick) {
      const alt = curveCellFilled ? pnlAtPrice(curveCellFilled.curve, price) : null;
      const btp = curveCellBt ? pnlAtPrice(curveCellBt.curve, price) : null;
      pick.innerHTML = `@ ${Math.round(price)} → <b style="color:${pnl >= 0 ? 'var(--profit)' : 'var(--loss)'}">${fmtN(pnl)}</b>`
        + (alt != null ? ` · <span style="color:#3d86c6">if filled <b>${fmtN(alt)}</b></span>` : '')
        // The backtest at the SAME hypothetical settle — the point being that the two books have different
        // shapes, so the gap between them is a function of price, not one number.
        + (btp != null ? ` · <span style="color:var(--bt)">backtest <b>${fmtN(btp)}</b></span>` : '');
    }
  });
  $('reload').addEventListener('click', load);
  // Re-render only the table: the source choice changes nothing about the curves or the strip.
  $('ordSrc').addEventListener('change', () => { if (record) renderOrders(); });
  const sl = $('timeSlider');
  if (sl) sl.addEventListener('input', () => {
    if (!record) return;
    const T = currentT();
    sliderLabel(T);
    renderCurve((record.state || {}).positions || [], settleEvent(), T);
  });
})();
</script>
