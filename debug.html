<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Debug — one variant, one day</title>
<script src="shared/market-calendar.js"></script>
<script src="shared/run-completeness.js"></script>
<script src="shared/portfolio-risk.js"></script>
<script src="client/lib/risk-curve-cell.js"></script>
<script src="client/lib/strategy-positions.js"></script>
<link rel="stylesheet" href="client/nq-chart.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="client/lib/nq-chart.js"></script>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#888; --grid:#e6e6e6; --profit:#26a69a; --loss:#ef5350; --zero:#bbb;
    --locked:#8b5cf6; --warn:#c98b8b; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; }
  header { padding:8px 14px 6px; border-bottom:1px solid var(--grid); }
  h1 { font-size:16px; margin:0 0 6px; display:inline-block; }
  h1 .ver { color:var(--muted); font:400 11px ui-monospace,monospace; margin-left:6px; }
  .ctl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  select, input[type=date], button { font:12px system-ui,sans-serif; padding:3px 6px; border:1px solid #ccc;
    border-radius:4px; background:#fff; color:inherit; }
  button { cursor:pointer; }
  .meta { color:var(--muted); font:11px ui-monospace,monospace; margin-left:2px; }
  .wrap { padding:10px 14px 40px; }
  .two { display:flex; gap:14px; align-items:flex-start; }
  .col-left { flex:1 1 0; min-width:0; }
  .col-right { flex:1 1 0; min-width:0; }
  .side-by-side { display:flex; gap:10px; margin-top:10px; }
  .side-by-side .panel { flex:1 1 0; min-width:0; }
  /* DENSE stat panels: they frame the trades table rather than compete with it, so they trade padding and
     leading for height. Long labels ellipsize instead of wrapping to a second line. */
  .side-by-side.dense .panel { padding:5px 7px; }
  .side-by-side.dense .panel h2 { font-size:11px; margin:0 0 3px; }
  .side-by-side.dense .kv { font-size:10.5px; line-height:1.25; }
  .side-by-side.dense .kv div { padding:0; gap:8px; }
  .side-by-side.dense .kv .k { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Below ~1100px two columns stop helping — the table gets too narrow to read next to a chart. */
  @media (max-width: 1100px) { .two { flex-direction:column; } .col-right .panel { max-height:none !important; } }
  #nq-chart { height:300px; }
  #nq-chart-container { border:0; }
  .panel { border:1px solid var(--grid); border-radius:6px; padding:8px 10px; }
  .panel h2 { font-size:12px; margin:0 0 6px; font-weight:700; }
  /* The shared cell renderer emits a FIXED-WIDTH svg (it is sized for a grid cell). Dropped into a flex
     column narrower than that it spilled over the panel and covered the day-summary next to it. Constrain
     the box and let the svg scale inside its own viewBox instead. */
  .panel { overflow:hidden; min-width:0; }
  #curveBox { position:relative; width:100%; }
  #curveBox svg { display:block; width:100%; height:auto; max-width:100%; }
  /* The "now" readout, positioned along the curve exactly as the compare cell does it. */
  .nowlbl { position:absolute; bottom:2px; transform:translateX(-50%); white-space:nowrap;
    font:11px ui-monospace,monospace; color:#555; background:rgba(255,255,255,.86); padding:0 3px; border-radius:3px; }
  .nowlbl i { font-style:normal; font-weight:700; margin-left:5px; }
  /* Time-of-day playback, same control the compare grid uses. */
  #timebar { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #timebar input[type=range] { flex:1; }
  .tb-time { font:11px ui-monospace,monospace; color:var(--muted); min-width:150px; text-align:right; }
  .kv { font:11px ui-monospace,monospace; }
  .kv div { display:flex; justify-content:space-between; gap:14px; padding:1px 0; }
  .kv .k { color:var(--muted); }
  table.ord { border-collapse:collapse; font:11px ui-monospace,monospace; width:100%; }
  table.ord th { text-align:right; padding:3px 6px; border-bottom:1px solid var(--grid); color:var(--muted);
    font-weight:600; white-space:nowrap; position:sticky; top:0; background:#fff; cursor:help;
    text-decoration:underline dotted rgba(125,125,125,.6); text-underline-offset:3px; }
  table.ord th:first-child, table.ord td:first-child { text-align:left; }
  table.ord td { text-align:right; padding:2px 6px; border-bottom:1px solid #f2f2f2; white-space:nowrap; }
  tr.td-unfilled { background:#fff6f6; opacity:.85; }
  tr.td-unfilled td:first-child { border-left:2px solid var(--loss); }
  tr.td-uncovered td:first-child { border-left:2px solid #e0a03c; }
  tr.td-cover td { color:#555; }
  tr.td-hedge td { color:#6b5ea8; background:#faf9ff; }
  tr.td-hedge td:first-child { border-left:2px solid #8b5cf6; }
  td.legs { font-size:10.5px; color:#444; text-align:left; }
  .net { font:600 9px system-ui,sans-serif; padding:0 3px; border-radius:2px; }
  .net.cr { background:#e6f5f2; color:#1c7f72; } .net.dr { background:#f1f1f1; color:#666; }
  .p { color:var(--profit); } .l { color:var(--loss); } .m { color:var(--muted); }
  .tag { padding:0 5px; border-radius:3px; font:600 9.5px system-ui,sans-serif; }
  .tag.ok { background:#e6f5f2; color:#1c7f72; } .tag.no { background:#fdecea; color:#a5322c; }
  .tag.w  { background:#f3efff; color:#5b3fa8; }
  .note { color:var(--muted); font-size:11px; margin:4px 0 0; max-width:900px; line-height:1.45; }
  #err { color:var(--loss); font:12px ui-monospace,monospace; padding:8px 14px; }
</style>

<header>
  <h1>Strategy Debug <span class="ver">v3.8.70</span></h1>
  <div class="ctl">
    <label>variant <select id="variant"></select></label>
    <label>date <input type="date" id="date"></label>
    <label>source
      <select id="src"><option value="live">Live runs (prod)</option><option value="backtest">Backtest replay (local)</option></select>
    </label>
    <button id="reload">Reload</button>
    <span class="meta" id="meta"></span>
  </div>
</header>
<div id="err"></div>
<div class="wrap">
  <!-- TWO COLUMNS. Left: the risk curve with the NQ candles directly beneath it, so the price action and
       the curve share one eye-line — the point is to see WHICH candle pattern was forming when a trade went
       on, and what that trade did to the curve. Right: the trades, scrolling independently so the table can
       be read against a chart that stays put. -->
  <div class="two">
    <div class="col-left">
      <div class="panel">
        <h2>Risk curve at settle <span class="meta" id="curveMeta"></span></h2>
        <div id="curveBox"><div id="curve"></div></div>
        <div id="timebar"><span style="font-size:11px;color:var(--muted)">Time of day</span>
          <input type="range" id="timeSlider" min="0" max="1" value="1" step="1" disabled>
          <span id="timeLabel" class="tb-time">full day</span></div>
      </div>

      <!-- The same NQ chart the index page uses. Trade markers are pushed in via NQChart.setTrades, so the
           opens and covers in the table appear on the candles at the times they were placed. -->
      <div class="panel" style="margin-top:10px">
        <h2>NQ futures <span class="meta">— trade markers from this run</span></h2>
        <div id="nq-chart-container">
          <div id="nq-chart-toolbar">
            <span id="nq-chart-tf-buttons"></span>
            <span id="nq-chart-ohlc" class="nq-chart-ohlc"></span>
          </div>
          <div id="nq-chart"></div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <!-- The numbers that frame the table sit directly above it: what this day actually did, against what
           765 days of backtest say the variant does. Kept deliberately dense — they are a reference while
           reading the orders, not the main event, so they must not push the table off the screen. -->
      <div class="side-by-side dense">
        <div class="panel">
          <h2>Day summary</h2>
          <div class="kv" id="summary"></div>
        </div>
        <div class="panel">
          <h2>Backtest expectation <span class="meta">(765d)</span></h2>
          <div class="kv" id="baseline"></div>
        </div>
      </div>
      <div class="panel" style="display:flex; flex-direction:column; margin-top:8px; max-height:calc(100vh - 210px)">
        <h2>Orders <span class="meta" id="ordMeta"></span></h2>
        <div id="ordScroll" style="flex:1; overflow:auto; min-height:0">
          <table class="ord" id="orders"></table>
        </div>
        <p class="note" id="ordNote"></p>
      </div>
    </div>
  </div>
</div>

<script>
// STRATEGY DEBUG — one variant, one day, in enough detail to answer "was that order placed where we
// expected?" without reading a JSON file.
//
// It exists because the aggregate views cannot show the thing that actually decides a day: for every
// cover, what the market was at the moment we placed it, what limit we sent, and what the rule would
// have allowed. On 2026-09-08 that comparison is the whole story — 43 of 101 covers never filled, and
// every one of them was resting below a market that had already moved past the profit ceiling.
//
// Split routing matches compare.html: LIVE runs come from PROD (the local engine only records while this
// machine is awake, so its days end at whatever ragged time the Mac slept), BACKTEST replay comes from
// LOCAL (the deployed box has no 5m datasets).
const IS_LOCAL_ORIGIN = (location.protocol === 'file:')
  || /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
const _p = new URLSearchParams(location.search);
const LOCAL_BASE = 'http://localhost:3001', PROD_BASE = 'https://d1kbxyxn33vpw2.cloudfront.net';
const forced = _p.get('proxy');
const LIVE_BASE = forced === 'local' ? LOCAL_BASE : forced === 'remote' ? PROD_BASE : PROD_BASE;
const BT_BASE   = forced === 'remote' ? PROD_BASE : LOCAL_BASE;
// nq-chart.js reads its API base off this global. Candles always come from LIVE_BASE: the chartseries
// endpoint is a PROD service, independent of whether the run record itself is live or a local backtest.
const PROXY_URL = LIVE_BASE;

const $ = (id) => document.getElementById(id);
const usd = (n) => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const sgn = (n) => n == null ? 'm' : n > 0 ? 'p' : n < 0 ? 'l' : 'm';
const num = (n, d = 2) => n == null ? '—' : (+n).toFixed(d);
const showErr = (m) => { $('err').textContent = m || ''; };

let record = null, baselines = null;

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status} — ${url.split('?')[0]}`);
  return r.json();
}

// ---- load -------------------------------------------------------------------------------------
async function loadVariants() {
  try {
    const j = await getJson(`${LIVE_BASE}/api/v1/candle-spread/runs?cb=${Date.now()}`);
    const list = (j.variants || []).map((v) => (typeof v === 'string' ? v : v.variant)).filter(Boolean);
    const sel = $('variant');
    sel.innerHTML = list.map((v) => `<option${v === (_p.get('variant') || 'v7-10') ? ' selected' : ''}>${v}</option>`).join('');
  } catch (e) { showErr('could not list variants: ' + e.message); }
}

async function loadBaselines() {
  for (const base of [BT_BASE, LIVE_BASE]) {
    try {
      const j = await getJson(`${base}/api/v1/candle-spread/baselines?cb=${Date.now()}`);
      baselines = j.variants || j; return;
    } catch (e) { /* try the other side */ }
  }
}

async function load() {
  showErr('');
  const variant = $('variant').value, date = $('date').value;
  if (!variant || !date) return;
  const base = $('src').value === 'backtest' ? BT_BASE : LIVE_BASE;
  $('meta').textContent = 'loading…';
  try {
    record = await getJson(`${base}/api/v1/candle-spread/runs/NDX/${date}?date=${date}&variant=${variant}&cb=${Date.now()}`);
  } catch (e) {
    record = null; showErr(`no run for ${variant} on ${date} (${e.message})`);
    $('meta').textContent = ''; $('orders').innerHTML = ''; $('summary').innerHTML = '';
    $('curve').innerHTML = ''; return;
  }
  render();
}

// ---- render -----------------------------------------------------------------------------------
function settleEvent() {
  return (record.events || []).filter((e) => e.type === 'eod_settlement').pop() || null;
}

function render() {
  const st = record.state || {}, cfg = record.config || {};
  const se = settleEvent();
  const W = cfg.spreadWidth, ML = (cfg.continuousCoverMinLockFrac || 0) * W;
  const pos = st.positions || [];
  const assess = window.RunCompleteness ? window.RunCompleteness.assessRun(record) : null;

  $('meta').innerHTML = `${cfg.variant || ''} · W $${W} · minLock $${num(ML)} · capFrac ${cfg.capFrac != null ? cfg.capFrac : '—'}`
    + (assess ? ` · <b>${assess.label}</b>` : '');

  // ---- summary
  const covered = pos.filter((p) => p.covered).length;
  const unfilled = pos.filter((p) => p.pendingCover && !p.covered).length;
  const fillPct = (covered + unfilled) ? Math.round(covered / (covered + unfilled) * 100) : null;
  const rows = [
    ['opens', pos.length],
    ['covers filled', covered],
    ['covers UNFILLED', unfilled],
    ['cover fill rate', fillPct == null ? '—' : fillPct + '%'],
    ['floor (covered only)', usd(se && se.floorPnl)],
    ['TERMINAL', usd(se && se.terminalPnl)],
    ['naked drag', se && se.terminalPnl != null && se.floorPnl != null ? usd(se.terminalPnl - se.floorPnl) : '—'],
    ['settle', se && se.settle != null ? num(se.settle, 2) + (se.settleSource ? ` (${se.settleSource})` : '') : '—'],
  ];
  $('summary').innerHTML = rows.map(([k, v]) =>
    `<div><span class="k">${k}</span><span class="${k === 'TERMINAL' || k === 'naked drag' ? sgn(parseFloat(String(v).replace(/[^0-9.-]/g, ''))) : ''}">${v}</span></div>`).join('');

  // ---- backtest expectation for THIS variant, so live and expected sit side by side
  const b = baselines && baselines[cfg.variant];
  $('baseline').innerHTML = b ? [
    ['avg/day', usd(b.avgDaily)], ['win%', b.winRate != null ? Math.round(b.winRate * 100) + '%' : '—'],
    ['avgWin', usd(b.avgWin)], ['avgLoss', usd(b.avgLoss)],
    ['trades/day', b.avgTradesPerDay != null ? (+b.avgTradesPerDay).toFixed(1) : '—'],
    ['avgLossPot', usd(b.avgWorstCase)], ['riskMax', b.governor ? usd(-b.governor.lossMax) : 'none'],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span>${v}</span></div>`).join('')
    : '<div class="k">no baseline for this variant</div>';

  buildTimeIndex();
  setupSlider();
  renderOrders(pos, W, ML, se);
  renderCurve(pos, se, null);
  syncNQ();
}

// Park the NQ chart on THIS run's session and mark its opens/covers on the candles — the same marker
// shape the index page pushes (open triangle by side, cover diamond), so a trade in the table can be
// found on the tape. Markers come from the same converter the order table uses, so the two agree.
function syncNQ() {
  if (!(window.NQChart && window.NQChart.setTrades)) return;
  const conv = window.strategyRunToOptionArray
    ? window.strategyRunToOptionArray(record, { includeUnfilled: true }) : null;
  const trades = [];
  for (const p of (conv && conv.positions) || []) {
    if (p.openEpoch) trades.push({ epoch: p.openEpoch, side: p.side, type: 'open' });
    if (p.covered && p.coverEpoch) trades.push({ epoch: p.coverEpoch, side: p.side, type: 'cover' });
  }
  window.NQChart.setTrades(trades);          // markers first, so the date jump can pan to them
  const date = $('date').value;
  if (date) window.NQChart.jumpToDate(date, { focusTrades: true });
}

// THE ORDER TABLE. Built on the SAME data shape the index page's "Strategy Trades" panel uses
// (strategyRunToOptionArray -> positions), so the columns, the row semantics and the glyphs match:
// ▲/▼ opens coloured by side, ◇ covers, OPEN* for an open with no FILLED cover, a dimmed
// "COVER (unfilled)" row for every resting order that was sent and never filled, and CR/DB net tags.
// Reusing the producer rather than reimplementing it is the point — a lookalike would drift.
//
// The diagnostic columns are APPENDED, not substituted: the cover's mark when it was placed, the
// ceiling the rule allowed, the gap between the two, and whether a profitable cover was available at
// all. That comparison is what makes "was this order placed where we expected?" answerable by looking.
function renderOrders(pos, W, ML, se) {
  const conv = window.strategyRunToOptionArray
    ? window.strategyRunToOptionArray(record, { includeUnfilled: true }) : null;
  const P = (conv && conv.positions) || [];
  const byId = {}; for (const p of (se && se.positions) || []) byId[p.id] = p;
  const raw = {}; for (const p of pos) raw[p.id] = p;

  // Same numbering rule as the index: #1.. by open time, covers inherit their open's number.
  const evs = [];
  P.forEach((p) => {
    evs.push({ id: p.id, type: 'open', side: p.side, time: p.openTime, epoch: p.openEpoch || 0,
      legs: p.openLegs || '', cost: Math.round((p.openLimit || 0) * 100 * (p.quantity || 1)), net: p.openNet || 'DEBIT' });
    if (p.coverLegs) evs.push({ id: p.id, type: 'cover', side: p.side, time: p.coverTime, epoch: p.coverEpoch || 0,
      legs: p.coverLegs, cost: Math.round((p.coverLimit || 0) * 100 * (p.quantity || 1)), net: p.coverNet || 'DEBIT' });
    else if (p.unfilledCover) evs.push({ id: p.id, type: 'cover', unfilled: true, side: p.side,
      time: p.unfilledCover.time, epoch: p.unfilledCover.epoch || (p.openEpoch || 0) + 1,
      legs: p.unfilledCover.legs, cost: Math.round((p.unfilledCover.limit || 0) * 100 * (p.quantity || 1)),
      net: p.unfilledCover.net || 'DEBIT' });
  });
  const seq = new Map();
  evs.filter((e) => e.type === 'open').sort((a, b) => a.epoch - b.epoch).forEach((e, i) => seq.set(e.id, i + 1));
  evs.sort((a, b) => a.epoch - b.epoch || (a.type === 'open' ? -1 : 1));
  const coveredIds = new Set(evs.filter((e) => e.type === 'cover' && !e.unfilled).map((e) => e.id));

  const COLS = [
    ['Time', 'ET time of the order'],
    ['Pos', 'position number, chronological by open; a cover carries its open’s number'],
    ['Event', '▲/▼ open (coloured by side), ◇ cover. OPEN* = no FILLED cover, so still exposed'],
    ['Legs', 'the spread as actually sent'],
    ['Cost', 'cash for the order; CR = credit received, DB = debit paid'],
    ['open %W', 'open cost as a fraction of width — capFrac caps this, and the closer to it, the less room a cover has'],
    ['cover mark', 'the cover’s MARK when the resting order was placed'],
    ['ceiling', 'W − openCost − minLock: the most the rule allows. This is what gets sent'],
    ['gap', 'sent − mark. Negative means it rests BELOW the market and only fills if the market comes to it'],
    ['cover?', 'was a profitable cover even available at placement (mark ≤ ceiling)?'],
    ['settle P&L', 'this position’s P&L at settlement'],
  ];
  const usdc = (c) => (c < 0 ? '-$' : '$') + Math.abs(c).toLocaleString();
  const color = (sd) => (sd === 'bull' ? 'var(--profit)' : 'var(--loss)');
  const glyph = (e) => (/^off-|^wing-/.test(e.id)) ? '⬡'
    : e.type === 'open' ? (e.side === 'bull' ? '▲' : '▼') : '◇';

  let restingBelow = 0, everCoverable = 0;
  const body = evs.map((e) => {
    const open = e.type === 'open';
    // Hedges (floorOffset `off-*`, wing conversion `wing-*`) reshape the risk curve; they are not strategy
    // opens and are never covered, so "OPEN*" misrepresented them as exposed positions awaiting a cover.
    const hedge = /^off-/.test(e.id) ? 'OFFSET' : /^wing-/.test(e.id) ? 'WING' : null;
    const isUncov = open && !hedge && !coveredIds.has(e.id);
    const label = hedge ? hedge
      : open ? (isUncov ? 'OPEN*' : 'OPEN') : (e.unfilled ? 'COVER (unfilled)' : 'COVER');
    const cr = e.net === 'CREDIT';
    const r = raw[e.id] || {}, pc = r.pendingCover || {};
    const ceiling = (W != null && r.limit != null) ? +(W - r.limit - ML).toFixed(2) : null;
    const mark = pc.markAtPlace != null ? pc.markAtPlace : null;
    const sent = pc.target != null ? pc.target : null;
    const gap = (sent != null && mark != null) ? +(sent - mark).toFixed(2) : null;
    const coverable = (mark != null && ceiling != null) ? mark <= ceiling : null;
    if (!open) { if (gap != null && gap < 0) restingBelow++; if (coverable) everCoverable++; }
    const sp = byId[e.id];
    // Diagnostics belong to the COVER order, so they only render on cover rows.
    const diag = open
      ? `<td class="${r.limit / W > 0.55 ? 'l' : 'm'}">${r.limit != null && W ? Math.round(r.limit / W * 100) + '%' : '—'}</td>`
        + '<td class="m">—</td><td class="m">—</td><td class="m">—</td><td class="m">—</td>'
      : '<td class="m">—</td>'
        + `<td>${num(mark)}</td><td class="m">${num(ceiling)}</td>`
        + `<td class="${gap != null && gap < 0 ? 'l' : 'm'}">${gap == null ? '—' : (gap > 0 ? '+' : '') + num(gap)}</td>`
        + `<td>${coverable == null ? '—' : coverable ? '<span class="tag ok">yes</span>' : '<span class="tag no">no</span>'}</td>`;
    return `<tr class="td-${e.type}${isUncov ? ' td-uncovered' : ''}${e.unfilled ? ' td-unfilled' : ''}${hedge ? ' td-hedge' : ''}" title="${e.id}">`
      + `<td>${e.time || '—'}</td><td>#${seq.get(e.id) || '?'}</td>`
      // Hedge rows take the row's purple here too (the inline colour otherwise beats tr.td-hedge).
      + `<td style="color:${hedge ? '#6b5ea8' : color(e.side)}">${glyph(e)} ${label}</td>`
      + `<td class="legs">${e.legs}</td>`
      + `<td>${cr ? '+' : ''}${usdc(e.cost)} <span class="net ${cr ? 'cr' : 'dr'}">${cr ? 'CR' : 'DB'}</span></td>`
      + diag
      + `<td class="${open && sp ? sgn(sp.pnl) : ''}">${open && sp ? usd(sp.pnl) : '—'}</td></tr>`;
  }).join('');

  $('orders').innerHTML = '<thead><tr>' + COLS.map(([c, t]) => `<th title="${t.replace(/"/g, '&quot;')}">${c}</th>`).join('')
    + '</tr></thead><tbody>' + body + '</tbody>';
  const isHedge = (e) => /^off-|^wing-/.test(e.id);
  const opens = evs.filter((e) => e.type === 'open' && !isHedge(e)).length;
  const hedges = evs.filter((e) => e.type === 'open' && isHedge(e)).length;
  const covers = evs.filter((e) => e.type === 'cover').length;
  const unf = evs.filter((e) => e.type === 'cover' && e.unfilled).length;
  $('ordMeta').textContent = `${opens} opens · ${covers} covers${unf ? ` (${unf} unfilled)` : ''}`
    + (hedges ? ` · ${hedges} hedge${hedges === 1 ? '' : 's'}` : '');
  $('ordNote').innerHTML = `<b>${restingBelow}</b> cover(s) rested BELOW the market; <b>${everCoverable}</b> `
    + `had a profitable cover available at placement. When "cover?" is <span class="tag no">no</span>, the mark `
    + `had already moved past the ceiling — the rule demands a locked profit, so no fillable price exists and `
    + `the position rides to expiry uncovered. That is the difference between a small loss and the full one.`;
}

// THE COMPARE PAGE'S CELL, rendered at full size. Identical code path, so the colouring, the dashed
// backtest references, the locked-floor violet and the extremes on the right edge all behave the same —
// a lookalike reimplementation would drift the moment either page changed.
const CW = 900, CH = 300;
const fmtN = (n) => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const usdK = (n) => n == null ? '—' : (Math.abs(n) >= 1000
  ? (n < 0 ? '-$' : '+$') + (Math.abs(n) / 1000).toFixed(1) + 'k'
  : (n < 0 ? '-$' : '+$') + Math.abs(Math.round(n)));
function pnlAtPrice(curve, x) {
  if (!curve || !curve.length) return null;
  let best = curve[0];
  for (const p of curve) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
  return best.y;
}
let dbgAbs = 0;   // one chart, so the saturation reference is that chart's own magnitude
// fontScale 2.1: this page draws ONE chart at full width, where the compare grid's thumbnail-sized
// 8-9.5px labels are unreadable. The peak, the floor and the dashed backtest averages are the numbers
// this page exists to show, so they get to be legible.
const cellCurve = window.RiskCurveCell.make({ fmtN, usdK, pnlAtPrice, CW, CH, gAbs: () => dbgAbs, fontScale: 2.1 });

// Build the same {curve, lo, hi, underlying, underPnl, ...} shape the compare grid feeds its cell.
function buildCell(pos, se) {
  const legs = [];
  for (const p of pos) {
    for (const l of (p.legs || [])) legs.push({ ...l, quantity: p.quantity || 1, cost: p.limit });
    if (p.covered) for (const l of (p.coverLegs || [])) legs.push({ ...l, quantity: p.quantity || 1, cost: p.coverLimit });
  }
  if (!legs.length) return null;
  const under = se && se.settle != null ? se.settle : null;
  const centre = under || 29500;
  const lo = centre * 0.985, hi = centre * 1.015;
  const cost = pos.reduce((a, p) => a + (p.limit || 0) * 100 * (p.quantity || 1)
    + (p.covered && p.coverLimit ? p.coverLimit * 100 * (p.quantity || 1) : 0), 0);
  const curve = [];
  for (let i = 0; i <= 240; i++) {
    const x = lo + (hi - lo) * (i / 240);
    let v = 0;
    for (const l of legs) {
      const intr = l.type === 'C' ? Math.max(0, x - l.strike) : Math.max(0, l.strike - x);
      v += (l.side === 'long' ? 1 : -1) * intr * 100 * (l.quantity || 1);
    }
    curve.push({ x, y: v - cost });
  }
  const ys = curve.map((c) => c.y);
  return { curve, lo: Math.min(...ys), hi: Math.max(...ys), xMin: lo, xMax: hi,
    worst: Math.min(...ys), best: Math.max(...ys),
    underlying: under, underPnl: under != null ? pnlAtPrice(curve, under) : null };
}

// TIME PLAYBACK. strategyRunToOptionArray takes an asOfEpoch and returns the book as it stood at that
// moment, so scrubbing rebuilds the curve rather than merely moving a marker — the same mechanism the
// compare grid uses. dayMin/dayMax come from the positions' own stamps (now including hedges, which
// derive theirs from the id when the record predates stamping).
let dayMin = 0, dayMax = 0, underMap = [];
function buildTimeIndex() {
  dayMin = 0; dayMax = 0; underMap = [];
  const st = (record && record.state) || {};
  const eps = [];
  for (const p of st.positions || []) {
    const e = p.openEpoch || (/^[a-z]+-(\d{13})-/.exec(p.id || '') || [])[1];
    if (e) eps.push(+e);
    if (p.coverEpoch) eps.push(p.coverEpoch);
  }
  for (const e of record.events || []) {
    if (e.type === 'candle_close' && e.underlying != null) {
      const t = Date.parse(e.time);
      if (Number.isFinite(t)) { underMap.push({ epoch: t, under: e.underlying }); eps.push(t); }
    }
  }
  const se = settleEvent();
  if (se && se.settle != null) {
    const t = Date.parse(se.time);
    if (Number.isFinite(t)) { underMap.push({ epoch: t, under: se.settle }); eps.push(t); }
  }
  underMap.sort((a, b) => a.epoch - b.epoch);
  if (eps.length) { dayMin = Math.min(...eps); dayMax = Math.max(...eps); }
}
function underlyingAt(T) {
  if (!underMap.length) return null;
  let u = underMap[0].under;
  for (const p of underMap) { if (p.epoch <= T) u = p.under; else break; }
  return u;
}
function currentT() {
  const s = document.getElementById('timeSlider');
  if (!s || s.disabled || !dayMax) return null;
  const t = Number(s.value);
  return Number.isFinite(t) && t < dayMax ? t : null;
}
function setupSlider() {
  const s = document.getElementById('timeSlider'), lbl = document.getElementById('timeLabel');
  if (!s) return;
  if (!dayMax || dayMax <= dayMin) { s.disabled = true; lbl.textContent = 'full day (no intraday stamps)'; return; }
  s.disabled = false; s.min = String(dayMin); s.max = String(dayMax);
  s.step = String(Math.max(1, Math.round((dayMax - dayMin) / 400)));
  s.value = String(dayMax);
  lbl.textContent = 'full day';
}
function sliderLabel(T) {
  const lbl = document.getElementById('timeLabel');
  if (!lbl) return;
  if (T == null) { lbl.textContent = 'full day'; return; }
  lbl.textContent = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit',
    minute: '2-digit', hour12: false }).format(new Date(T)) + ' ET';
}

// THE COUNTERFACTUAL BOOK: every resting cover that never filled, treated as filled at the price it was
// resting at. Drawn as the dashed blue line against the solid actual curve, so the gap between them IS
// the execution shortfall — the two lines converge as the fill problem gets fixed. Positions the engine
// never even placed a cover on are left alone; this measures unfilled ORDERS, not missing decisions.
function filledBook(pos) {
  let any = false;
  const out = pos.map((p) => {
    const pc = p.pendingCover;
    if (p.covered || !pc || !pc.legs) return p;
    any = true;
    return { ...p, covered: true, coverLegs: pc.legs, coverLimit: pc.target };
  });
  return any ? out : null;
}

let curveCell = null, curveCellFilled = null;   // kept for the click readout

function renderCurve(pos, se, T) {
  const host = document.getElementById('curve');
  // Rebuild the book as of T; at full day this is the whole book, so the default path is unchanged.
  let bookPos = pos;
  if (T != null && window.strategyRunToOptionArray) {
    const conv = window.strategyRunToOptionArray(record, { asOfEpoch: T });
    const keep = new Set((conv.positions || []).map((x) => x.id));
    bookPos = pos.filter((p) => keep.has(p.id)).map((p) => {
      const c = (conv.positions || []).find((x) => x.id === p.id);
      return c && !c.covered ? { ...p, covered: false, coverLegs: null, coverLimit: null } : p;
    });
  }
  const d = buildCell(bookPos, T != null ? null : se);
  if (d && T != null) {
    const u = underlyingAt(T);
    d.underlying = u;
    d.underPnl = u != null ? pnlAtPrice(d.curve, u) : null;
  }
  if (!d) { host.outerHTML = '<div id="curve"></div>'; $('curveMeta').textContent = 'no positions'; return; }
  dbgAbs = Math.max(Math.abs(d.lo), Math.abs(d.hi));
  const bt = (baselines && record && baselines[(record.config || {}).variant]) || null;
  const btRef = bt ? { worst: bt.avgWorstCase, best: bt.avgBestCase } : null;
  // The "now" readout — underlying and the P&L AT that underlying — positioned along the curve, exactly
  // as the compare cell does it. Without it the vertical line says where we are but not what it is worth.
  let nowlbl = '';
  if (d.underlying != null) {
    const xu = ((d.underlying - d.xMin) / ((d.xMax - d.xMin) || 1)) * 100;
    const lx = Math.max(4, Math.min(96, xu));
    const pnl = d.underPnl != null
      ? `<i style="color:${d.underPnl >= 0 ? 'var(--profit)' : 'var(--loss)'}">${fmtN(d.underPnl)}</i>` : '';
    nowlbl = `<div class="nowlbl" style="left:${lx.toFixed(1)}%">${Math.round(d.underlying)}${pnl}</div>`;
  }
  // Counterfactual overlay: same book with every unfilled resting cover treated as filled.
  const fb = filledBook(bookPos);
  let dF = fb ? buildCell(fb, T != null ? null : se) : null;
  if (dF) { dF.label = 'if all covers filled'; }
  curveCell = d; curveCellFilled = dF;
  // Both curves must share one y-scale or the comparison is meaningless.
  const yLo = Math.min(d.lo, dF ? dF.lo : d.lo), yHi = Math.max(d.hi, dF ? dF.hi : d.hi);
  dbgAbs = Math.max(Math.abs(yLo), Math.abs(yHi));
  host.outerHTML = `<div id="curve">${cellCurve((record.config || {}).variant, d, yLo, yHi, btRef, dF)}${nowlbl}</div>`;
  const gap = (dF && d.underPnl != null && dF.underPnl != null) ? dF.underPnl - d.underPnl : null;
  $('curveMeta').innerHTML = `min ${fmtN(d.lo)} · max ${fmtN(d.hi)}`
    + (d.underlying != null ? ` · settle ${Math.round(d.underlying)} → ${fmtN(d.underPnl)}` : '')
    + (dF ? ` · <span style="color:#3d86c6">if filled ${fmtN(dF.lo)} / ${fmtN(dF.hi)}` + (gap != null ? ` (${gap >= 0 ? '+' : ''}${fmtN(gap)} at settle)` : '') + '</span>' : '')
    + ` <span id="curvePick" style="margin-left:8px"></span>`;
}

// ---- boot -------------------------------------------------------------------------------------
(async function boot() {
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('date').value = _p.get('date') || today;
  if (_p.get('src')) $('src').value = _p.get('src');
  await loadVariants();
  await loadBaselines();
  await load();
  for (const id of ['variant', 'date', 'src']) $(id).addEventListener('change', load);
  // Click anywhere on the curve to read the P&L at that settlement price — same interaction as the
  // compare grid. Reports BOTH the actual book and the if-all-filled book so the execution gap is
  // readable at any price, not only at the settle.
  document.getElementById('curveBox').addEventListener('click', (e) => {
    const svg = e.target.closest('svg[data-v]'); if (!svg || !curveCell) return;
    const rect = svg.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / (rect.width || 1)));
    const price = curveCell.xMin + frac * (curveCell.xMax - curveCell.xMin);
    const pnl = pnlAtPrice(curveCell.curve, price);
    const cur = svg.querySelector('line.cursor');
    if (cur) { const cx = (frac * CW).toFixed(1); cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.setAttribute('visibility', 'visible'); }
    const pick = document.getElementById('curvePick');
    if (pick) {
      const alt = curveCellFilled ? pnlAtPrice(curveCellFilled.curve, price) : null;
      pick.innerHTML = `@ ${Math.round(price)} → <b style="color:${pnl >= 0 ? 'var(--profit)' : 'var(--loss)'}">${fmtN(pnl)}</b>`
        + (alt != null ? ` · <span style="color:#3d86c6">if filled <b>${fmtN(alt)}</b></span>` : '');
    }
  });
  $('reload').addEventListener('click', load);
  const sl = $('timeSlider');
  if (sl) sl.addEventListener('input', () => {
    if (!record) return;
    const T = currentT();
    sliderLabel(T);
    renderCurve((record.state || {}).positions || [], settleEvent(), T);
  });
})();
</script>
